services:
  postgres:
    image: postgres:16
    container_name: characterizing-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: characterizing
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    container_name: characterizing-redis
    ports:
      - "6379:6379"
volumes:
  postgres_data: